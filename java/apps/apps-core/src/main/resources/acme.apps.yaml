spring.config.import: classpath:acme.oms.yaml
spring.temporal:
  namespace: ${TEMPORAL_APPS_NAMESPACE:apps}
  connection:
    target: ${TEMPORAL_APPS_ADDRESS:localhost:7233}
    api-key: ${TEMPORAL_APPS_API_KEY:}
  namespaces:
    - namespace: apps
      alias: apps
      nexus-service-clients:
        - endpoint: oms-apps-v1
          service: com.acme.oms.services.AppsService
        - endpoint: oms-support-v1
          service: com.acme.oms.services.SupportService
  workers:
    - task-queue: apps
      workflow-classes:
        - ${ACME_APPS_ORDER_WORKFLOW_CLASS:com.acme.apps.workflows.v3.OrderImpl}
      activity-beans:
        - options-activities
      nexus-service-beans:
        - apps-service
      workflow-task-pollers-configuration:
        poller-behavior-autoscaling:
          min-concurrent-task-pollers: 2 # preserve default
          max-concurrent-task-pollers: 10
      activity-task-pollers-configuration:
        poller-behavior-autoscaling:
          enabled: true
      nexus-task-pollers-configuration:
        poller-behavior-autoscaling:
          enabled: true
      deployment-properties:
        use-versioning: true
        default-versioning-behavior: PINNED
        deployment-name: ${TEMPORAL_DEPLOYMENT_NAME:apps}
        build-id: ${TEMPORAL_WORKER_BUILD_ID:local}
