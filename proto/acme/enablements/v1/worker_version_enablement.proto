syntax = "proto3";

package acme.enablements.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "acme/enablements/domain/v1/commerce.proto";

// Start a worker versioning enablement demonstration
message StartWorkerVersionEnablementRequest {

  string enablement_id = 1;      // e.g., "demo-session-2026-03-18"
  int32 order_count = 2;            // How many orders to process (e.g., 20)
  int32 submit_rate_per_min = 3;    // Orders per minute (e.g., 12)
  google.protobuf.Duration timeout = 4;  // How long to run (e.g., 5 minutes)
  optional string order_id_seed = 5;
  repeated ScenarioWeight scenario_weights = 6; // weighted mix of DemoScenario; empty defaults to mostly NORMAL
  repeated BusinessScenarioWeight business_scenario_weights = 7; // weighted mix of BusinessScenario; empty defaults to mostly NORMAL
}

// Weight for one DemoScenario in the generated load's scenario mix.
message ScenarioWeight {
  acme.enablements.domain.enablements.v1.DemoScenario scenario = 1;
  int32 weight = 2;
}

// Weight for one BusinessScenario in the generated load's scenario mix.
message BusinessScenarioWeight {
  acme.enablements.domain.enablements.v1.BusinessScenario scenario = 1;
  int32 weight = 2;
}

// Current state of the worker versioning enablement demonstration
// (Order tracking is the responsibility of the OMS application, not this workflow)
message WorkerVersionEnablementState {

  string enablement_id = 1;
  StartWorkerVersionEnablementRequest args = 2;
  // Workflow execution state
  enum DemoPhase {
    DEMO_PHASE_UNSPECIFIED = 0;
    RUNNING_V1_ONLY = 1;
    TRANSITIONING_TO_V2 = 2;
    RUNNING_BOTH = 3;
    COMPLETE = 4;
  }
  DemoPhase current_phase = 3;

  // Activity metrics
  int32 orders_submitted_count = 4;    // How many times submitOrder() was called
  float orders_per_minute = 5;         // Current submission rate
  repeated string active_versions = 6; // ["v1"] or ["v1", "v2"] depending on phase

  // Versioning info
  google.protobuf.Timestamp last_transition_at = 7;  // When transitionToV2 was signaled
  repeated DeployWorkerVersionRequest deploy_requests = 8;
  repeated DeployWorkerVersionResponse deployments = 9;
}

// Submits one order to the Commerce App / Payments Processor backends
// (SPECS/commerce-payments-apps/spec.md), not directly to apps-api.
message SubmitOneOrderRequest {
  string enablement_id = 1;
  string order_id_prefix = 2;
  acme.enablements.domain.enablements.v1.DemoScenario scenario = 3;
  acme.enablements.domain.enablements.v1.BusinessScenario business_scenario = 4;
}
message SubmitOneOrderResponse {
  string order_id = 1;
  string charge_id = 2;
}

message DeployWorkerVersionRequest {
  string deployment_name = 1;
  string build_id = 2;
  string version = 3;
  optional int32 replica_count = 4;
}
message DeployWorkerVersionResponse {
  // Fully-qualified workflow class resolved for the request's deployment_name + version,
  // e.g. "com.acme.apps.workflows.v3.OrderImpl" (spec.md's package-per-version convention).
  string workflow_class = 1;
  // True once `temporal worker deployment set-current-version` succeeded for this build id.
  bool current_version_set = 2;
  // Raw `temporal worker deployment describe --output json` text captured right after the
  // set-current-version call, so a silent no-op can't happen unnoticed.
  string describe_output = 3;
}

// One row of spec.md's OMS version -> component version mapping table
// (hosting.md "OMS-Version-Driven Promotion"). fulfillment_version is
// "embedded" for OMS versions before fulfillment existed as its own
// deployable component.
message OmsVersionRow {
  string oms_version = 1;
  string apps_version = 2;
  string processing_version = 3;
  string fulfillment_version = 4;
  string description = 5;
  bool future = 6;
}

message ListOmsVersionsResponse {
  repeated OmsVersionRow rows = 1;
}

// Starts the OmsVersionRollout workflow for a target OMS version.
message StartOmsVersionRolloutRequest {
  string rollout_id = 1;
  string oms_version = 2;
}

// Shared by OmsVersionRolloutStep.status and OmsVersionRolloutState.overall_status:
// kept top-level, not nested in one message, since it's a status for both.
enum RolloutStepStatus {
  ROLLOUT_STEP_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  IN_PROGRESS = 2;
  SUCCEEDED = 3;
  FAILED = 4;
  SKIPPED = 5;
}

// One bounded-context promotion within an OMS version rollout.
message OmsVersionRolloutStep {
  string bounded_context = 1;
  string target_version = 2;
  RolloutStepStatus status = 3;
  string error_message = 4;
  DeployWorkerVersionResponse result = 5;
}

// Current state of the OmsVersionRollout workflow.
message OmsVersionRolloutState {
  string rollout_id = 1;
  string oms_version = 2;
  RolloutStepStatus overall_status = 3;
  repeated OmsVersionRolloutStep steps = 4;
  string error_message = 5;
}

// Current state of the runSubmissionLoop Standalone Activity Execution that
// enablements-api starts, observes, and cancels directly (no owning
// workflow). Distinct from WorkerVersionEnablementState, which serves the
// separate WorkerVersionEnablement workflow path.
message LoadGenerationState {
  enum ExecutionStatus {
    EXECUTION_STATUS_UNSPECIFIED = 0;
    RUNNING = 1;
    COMPLETED = 2;
    CANCELED = 3;
    FAILED = 4;
  }

  string enablement_id = 1;
  ExecutionStatus status = 2;
  int32 orders_submitted_count = 3; // from the activity's last heartbeat details
}