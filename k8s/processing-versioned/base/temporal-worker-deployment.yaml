apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: processing-workers
  namespace: temporal-oms-processing
spec:
  replicas: 1
  workerOptions:
    connectionRef:
      name: temporal-connection
    temporalNamespace: processing
  sunset:
    scaledownDelay: 30s
    deleteDelay: 120s
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 50
        pauseDuration: 30s
      - rampPercentage: 90
        pauseDuration: 30s
  template:
    metadata:
      labels:
        app: processing-workers
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: "true"
    spec:
      containers:
      - name: worker
        image: temporal-oms/processing-workers:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 9082
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s
        - name: JAVA_OPTS
          value: "-Dgrpc.netty.keepaliveTime=30 -Dgrpc.netty.keepaliveTimeout=5 -Dgrpc.netty.keepaliveWithoutCalls=true"
        envFrom:
        - configMapRef:
            name: temporal-oms-config
        - secretRef:
            name: temporal-oms-secrets
        volumeMounts:
        - name: temporal-config
          mountPath: /etc/config/temporal
          readOnly: true
        - name: temporal-secret
          mountPath: /etc/config/temporal-secret
          readOnly: true
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: temporal-config
        configMap:
          name: temporal-processing-config
          defaultMode: 0444
      - name: temporal-secret
        secret:
          secretName: temporal-processing-api-key
          defaultMode: 0444
