apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: temporal-oms-web
  labels:
    app: web
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        component: web
    spec:
      containers:
      - name: web
        image: temporal-oms/web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PUBLIC_TEMPORAL_UI_BASE_URL
          value: "http://localhost:8233"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: temporal-oms-web
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
