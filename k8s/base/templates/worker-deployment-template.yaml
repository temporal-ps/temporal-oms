# Generalized plain-Deployment template for on-demand worker version promotion
# (hosting.md Mode B). Used for bounded contexts that run as a plain Kubernetes
# Deployment: apps and fulfillment always, processing only for v1 (spec.md's true
# unversioned baseline - see DeploymentActivitiesImpl's class Javadoc); processing's
# other versions keep using k8s/processing-versioned's WorkerDeployment CRD instead.
#
# Placeholders substituted by DeploymentActivitiesImpl: {NAME}, {NAMESPACE},
# {REPLICAS}, {IMAGE}, {MANAGEMENT_PORT}, {DEPLOYMENT_NAME}, {BUILD_ID},
# {SPRING_PROFILES_ACTIVE}, {WORKFLOW_CLASS_ENV}, {WORKFLOW_CLASS_VALUE},
# {CONFIGMAP_NAME}, {SECRET_NAME}. {IMAGE} is always the same tag every version
# uses (every version's code ships in one image, see spec.md's package-per-version
# convention) - {WORKFLOW_CLASS_ENV}/{WORKFLOW_CLASS_VALUE} is what actually
# selects which OrderImpl class runs. {SPRING_PROFILES_ACTIVE} is "k8s,unversioned"
# for build-id v1, plain "k8s" otherwise - the unversioned profile's
# acme.<context>-unversioned.yaml has no deployment-properties block at all, the
# only way to get zero Worker Versioning registration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {NAME}
  namespace: {NAMESPACE}
  labels:
    app: {NAME}
    component: worker
    bounded-context: {DEPLOYMENT_NAME}
    oms-build-id: "{BUILD_ID}"
spec:
  replicas: {REPLICAS}
  selector:
    matchLabels:
      app: {NAME}
  template:
    metadata:
      labels:
        app: {NAME}
        component: worker
        bounded-context: {DEPLOYMENT_NAME}
        oms-build-id: "{BUILD_ID}"
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: "true"
    spec:
      containers:
      - name: worker
        image: {IMAGE}
        imagePullPolicy: Never
        ports:
        - containerPort: {MANAGEMENT_PORT}
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: {SPRING_PROFILES_ACTIVE}
        - name: TEMPORAL_DEPLOYMENT_NAME
          value: {DEPLOYMENT_NAME}
        - name: TEMPORAL_WORKER_BUILD_ID
          value: "{BUILD_ID}"
        - name: {WORKFLOW_CLASS_ENV}
          value: {WORKFLOW_CLASS_VALUE}
        envFrom:
        - configMapRef:
            name: temporal-oms-config
        - secretRef:
            name: temporal-oms-secrets
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: {MANAGEMENT_PORT}
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: {MANAGEMENT_PORT}
          initialDelaySeconds: 20
          periodSeconds: 5
        volumeMounts:
        - name: temporal-config
          mountPath: /etc/config/temporal
          readOnly: true
        - name: temporal-secret
          mountPath: /etc/config/temporal-secret
          readOnly: true
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
      volumes:
      - name: temporal-config
        configMap:
          name: {CONFIGMAP_NAME}
          defaultMode: 0444
      - name: temporal-secret
        secret:
          secretName: {SECRET_NAME}
          # Local Temporal doesn't create this Secret at all (mirrors k8s/overlays/local's
          # own patch, which strips this volume entirely from the base apps/processing/
          # fulfillment Deployments for the same reason) - this Deployment is created
          # programmatically at runtime, so that kustomize patch can never reach it.
          # optional: true degrades to an empty mount instead of blocking pod startup.
          optional: true
          defaultMode: 0444
---
apiVersion: v1
kind: Service
metadata:
  name: {NAME}
  namespace: {NAMESPACE}
  labels:
    app: {NAME}
spec:
  type: ClusterIP
  selector:
    app: {NAME}
  ports:
  - port: {MANAGEMENT_PORT}
    targetPort: {MANAGEMENT_PORT}
    protocol: TCP
    name: management
