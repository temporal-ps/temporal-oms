# Template for a CRD-managed bounded context's WorkerDeployment (hosting.md Mode B).
# Mirrors k8s/processing-versioned/base/temporal-worker-deployment.yaml; used only by
# DeploymentActivitiesImpl to recreate that CRD if it's ever missing when a versioned
# promotion runs (the deploy scripts provision it once at bring-up and never delete it,
# so this is a recovery path, not the normal creation path).
#
# Placeholders substituted by DeploymentActivitiesImpl: {NAME}, {NAMESPACE}, {REPLICAS},
# {IMAGE}, {MANAGEMENT_PORT}, {DEPLOYMENT_NAME}, {CONFIGMAP_NAME}.
apiVersion: temporal.io/v1alpha1
kind: WorkerDeployment
metadata:
  name: {NAME}
  namespace: {NAMESPACE}
spec:
  replicas: {REPLICAS}
  workerOptions:
    connectionRef:
      name: temporal-connection
    temporalNamespace: {DEPLOYMENT_NAME}
  sunset:
    scaledownDelay: 30s
    deleteDelay: 120s
  rollout:
    strategy: Progressive
    steps:
      - rampPercentage: 50
        pauseDuration: 30s
      - rampPercentage: 90
        pauseDuration: 30s
  template:
    metadata:
      labels:
        app: {NAME}
      annotations:
        instrumentation.opentelemetry.io/inject-sdk: "true"
    spec:
      containers:
      - name: worker
        image: {IMAGE}
        imagePullPolicy: Never
        ports:
        - containerPort: {MANAGEMENT_PORT}
          name: management
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: k8s
        - name: JAVA_OPTS
          value: "-Dgrpc.netty.keepaliveTime=30 -Dgrpc.netty.keepaliveTimeout=5 -Dgrpc.netty.keepaliveWithoutCalls=true"
        envFrom:
        - configMapRef:
            name: temporal-oms-config
        - secretRef:
            name: temporal-oms-secrets
        volumeMounts:
        - name: temporal-config
          mountPath: /etc/config/temporal
          readOnly: true
      volumes:
      - name: temporal-config
        configMap:
          name: {CONFIGMAP_NAME}
          defaultMode: 0444
